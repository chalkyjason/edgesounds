# Army Jay OSD font variants.
#
# One glyph source set, one pipeline (tools/build_font.py), three outputs.
# A variant is a set of deliberate differences from the base art, never a
# second copy of the font.
#
#   text_set        which letter/digit/punctuation art to use
#   icon_overrides  extra icon modules layered over glyphs/icons.py, in order
#   extra_outline   additional rings of black around the ASCII block (0x20-0x5F)
#
# `extra_outline` is how the high-readability variant gets its weight. It
# thickens the black surround rather than the white strokes: at a 12px cell
# the counters close if the strokes grow, and a filled-in 8 or B is worse
# than a thin one. Contrast is what degrades on an analog feed, so contrast
# is what the variant buys. It applies only to the ASCII block -- widening
# the AH ladder or the progress bar would merge their segments.

[meta]
protected_source = "assets/references/stock/default_v2.mcm"
output_dir = "fonts"

# The boot splash, and with it the in-flight wordmark, is identical in
# every variant: it is the brand, and a pilot swapping variants should not
# get a different logo.
logo_module = "glyphs.logo"


[variants.armyjay_full]
description = "Flagship. Custom Army Jay letterforms and custom Army Jay icons."
output = "armyjay_full.mcm"
text_set = "standard"
icon_overrides = []
extra_outline = 0

[variants.armyjay_clean]
description = """\
Custom Army Jay letterforms, with the six icons whose silhouette departs \
most from stock redrawn to match it. Differs from the flagship at 6 of 256 \
glyphs -- the other icons are unchanged Army Jay art that already follows \
the stock shape."""
output = "armyjay_clean.mcm"
text_set = "standard"
icon_overrides = ["glyphs.icons_clean"]
extra_outline = 0

[variants.armyjay_highreadability]
description = """\
Maximum legibility on a degraded analog feed: a doubled black surround on \
every letter and digit, and icons stripped of internal detail."""
output = "armyjay_highreadability.mcm"
text_set = "standard"
icon_overrides = ["glyphs.icons_simplified"]
extra_outline = 1


# Optional, and off by default. The craft-name field can only reach glyphs
# at typeable ASCII indexes, so showing the wordmark in flight through it
# means copying the wordmark tiles onto sacrificial punctuation slots. That
# costs those glyphs, which is why it is a variant and not the default.
#
# This is the route that works on Betaflight 4.4 through current. Betaflight
# has no "OSD Custom Elements" feature -- that is INAV, and the build handoff
# conflated the two. On Betaflight master a custom message can carry raw
# glyph indexes instead and costs nothing; it does not exist in 4.5.
#
# Build with:  python tools/build_font.py --craft-name
#
# The slots and the craft name to type are emitted into the build log and
# into MODIFIED_INDEXES.md.
[craft_name]
enabled = false
suffix = "_craftname"
