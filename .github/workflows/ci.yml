name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unit tests (round trip, parser, validator)
        run: python -m unittest discover -s tests -v

      - name: Validate vendored stock fonts
        run: python tools/validate.py --verbose

      - name: Validate built fonts
        run: |
          shopt -s nullglob
          fonts=(fonts/*.mcm)
          if [ ${#fonts[@]} -eq 0 ]; then
            echo "No fonts built yet (handoff steps 3-5 outstanding); skipping."
            exit 0
          fi
          python tools/validate.py --verbose "${fonts[@]}"
